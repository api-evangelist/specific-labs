name: Specific Labs
description: >-
  Specific Labs is a Y Combinator-backed (Fall 2025) applied AI research lab
  based in San Francisco and operated by Bear AI Inc. The company builds
  datasets and benchmarks derived from real enterprise workflows, capturing
  authentic business decision-making patterns and audio and enterprise data that
  are otherwise hard to access, and turns them into training data and evaluation
  benchmarks for building reliable, domain-grounded AI agents. It works with
  frontier AI labs seeking datasets from real enterprises and with enterprises
  building dependable agents. Founded by Janak Sunil (CEO, formerly Coinbase) and
  Siddhant Paliwal (CTO). As of this profile Specific Labs publishes a marketing
  site with a benchmarks page and company information, and does not yet expose a
  public API, SDKs, or developer portal.
